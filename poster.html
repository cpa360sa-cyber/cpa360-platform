<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Birthday poster — CPA360</title>
<link rel="icon" href="./assets/logo-cpa360.webp" />
<style>
  :root{ --navy:#1c3a68; --green:#2f7d4f; --ink:#14203a; --muted:#5d6980; --line:#d9deea; --bg:#f3f5fa; --card:#fff; --bad:#b3261e; }
  @media (prefers-color-scheme:dark){ :root{ --ink:#e8ecf5; --muted:#a3adc2; --line:#34405a; --bg:#0f1626; --card:#18233b; } }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Public Sans","Segoe UI",system-ui,Arial,sans-serif; line-height:1.5; -webkit-text-size-adjust:100%; }
  .wrap{ max-width:480px; margin:0 auto; padding:16px 16px 40px; }
  header{ display:flex; align-items:center; gap:10px; padding:4px 2px 12px; }
  header img{ height:32px; width:auto; }
  header span{ font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 16px; box-shadow:0 6px 24px rgba(20,32,58,.07); }
  h1{ font-size:20px; line-height:1.25; margin:0 0 6px; color:var(--navy); }
  @media (prefers-color-scheme:dark){ h1{ color:#cfe0ff; } }
  p{ margin:8px 0; } .muted{ color:var(--muted); font-size:14px; }
  .posters{ display:grid; gap:12px; margin:14px 0; }
  .posters img{ width:100%; height:auto; border-radius:12px; border:1px solid var(--line); display:block; background:#eee; }
  button,.btn{ font:inherit; font-weight:700; border-radius:14px; border:1.5px solid var(--line); background:transparent; color:inherit; padding:14px 16px; cursor:pointer; min-height:52px; display:flex; align-items:center; justify-content:center; width:100%; text-align:center; text-decoration:none; margin-top:10px; }
  button.primary{ background:#25d366; border-color:#25d366; color:#06361a; font-size:18px; }
  button:disabled{ opacity:.5; }
  .steps{ background:color-mix(in srgb,var(--navy) 8%,transparent); border-radius:12px; padding:10px 14px; font-size:14px; }
  .steps b{ color:var(--navy); } @media (prefers-color-scheme:dark){ .steps b{ color:#cfe0ff; } }
  .msg{ margin-top:10px; font-size:14px; min-height:20px; } .msg.err{ color:var(--bad); }
  .foot{ margin-top:16px; text-align:center; font-size:12px; color:var(--muted); }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header><img src="./assets/logo-cpa360.webp" alt="CPA360" /><span>Birthday poster</span></header>
  <main class="card" id="root"><p class="muted">Loading the poster…</p></main>
  <p class="foot">This link works for 12 hours.<br>CPA360™ — A GAD Foundation Programme</p>
</div>
<script src="./config.js"></script>
<script src="./src/poster-share.js"></script>
</body>
</html>
