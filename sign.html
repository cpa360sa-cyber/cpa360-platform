<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Sign your membership card — CPA360</title>
<link rel="icon" href="./assets/logo-cpa360.webp" />
<style>
  :root{ --navy:#1c3a68; --green:#2f7d4f; --gold:#b98a2e; --ink:#14203a; --muted:#5d6980; --line:#d9deea; --bg:#f3f5fa; --card:#fff; --bad:#b3261e; }
  @media (prefers-color-scheme:dark){ :root{ --ink:#e8ecf5; --muted:#a3adc2; --line:#34405a; --bg:#0f1626; --card:#18233b; } }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Public Sans","Segoe UI",system-ui,Arial,sans-serif; line-height:1.5; -webkit-text-size-adjust:100%; }
  .wrap{ max-width:560px; margin:0 auto; padding:18px 16px 40px; }
  header{ display:flex; align-items:center; gap:10px; padding:6px 2px 14px; }
  header img{ height:34px; width:auto; }
  header span{ font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px 18px; box-shadow:0 6px 24px rgba(20,32,58,.07); }
  h1{ font-size:21px; line-height:1.25; margin:0 0 6px; color:var(--navy); }
  @media (prefers-color-scheme:dark){ h1{ color:#cfe0ff; } }
  p{ margin:8px 0; }
  .muted{ color:var(--muted); font-size:14px; }
  .who{ background:color-mix(in srgb,var(--navy) 8%,transparent); border-radius:12px; padding:12px 14px; margin:14px 0; }
  .who b{ display:block; font-size:18px; }
  label{ display:block; font-weight:700; font-size:14px; margin:14px 0 6px; }
  input[type=text],input[type=tel]{ width:100%; font:inherit; font-size:18px; letter-spacing:.2em; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; background:transparent; color:inherit; }
  .pad{ position:relative; height:210px; border:2px dashed var(--line); border-radius:14px; background:#fff; touch-action:none; overflow:hidden; }
  .pad canvas{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:crosshair; }
  .pad .line{ position:absolute; left:6%; right:6%; top:72%; border-top:1px solid #b8bfcc; pointer-events:none; }
  .pad .x{ position:absolute; left:3%; top:calc(72% - 24px); font-size:20px; color:#8a93a6; pointer-events:none; }
  .pad .hint{ position:absolute; inset:0; display:grid; place-items:center; color:#9aa3b5; font-size:15px; pointer-events:none; }
  .row{ display:flex; gap:10px; margin-top:10px; }
  button{ font:inherit; font-weight:700; border-radius:12px; border:1.5px solid var(--line); background:transparent; color:inherit; padding:12px 16px; cursor:pointer; min-height:46px; }
  button.primary{ background:var(--green); border-color:var(--green); color:#fff; flex:1; font-size:16px; }
  button:disabled{ opacity:.45; cursor:not-allowed; }
  .consent{ display:flex; gap:10px; align-items:flex-start; font-size:14px; margin:16px 0 4px; cursor:pointer; }
  .consent input{ width:22px; height:22px; margin-top:1px; flex:none; }
  .msg{ margin-top:12px; font-size:14px; min-height:20px; }
  .msg.err{ color:var(--bad); } .msg.ok{ color:var(--green); }
  .done{ text-align:center; padding:26px 8px; }
  .done .tick{ width:64px; height:64px; border-radius:50%; background:var(--green); color:#fff; display:grid; place-items:center; font-size:34px; margin:0 auto 12px; }
  .foot{ margin-top:18px; text-align:center; font-size:12px; color:var(--muted); }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header><img src="./assets/logo-cpa360.webp" alt="CPA360" /><span>Secure signing</span></header>
  <main class="card" id="root"><p class="muted">Loading…</p></main>
  <p class="foot">This page is private to you. Please don't share the link.<br>CPA360™ — A GAD Foundation Programme</p>
</div>
<script src="./config.js"></script>
<script src="./src/sign.js"></script>
</body>
</html>
