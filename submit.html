<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Send your documents — CPA360</title>
<link rel="icon" href="./assets/logo-cpa360.webp" />
<style>
  :root{ --navy:#1c3a68; --green:#2f7d4f; --gold:#b98a2e; --ink:#14203a; --muted:#5d6980; --line:#d9deea; --bg:#f3f5fa; --card:#fff; --bad:#b3261e; }
  @media (prefers-color-scheme:dark){ :root{ --ink:#e8ecf5; --muted:#a3adc2; --line:#34405a; --bg:#0f1626; --card:#18233b; } }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Public Sans","Segoe UI",system-ui,Arial,sans-serif; line-height:1.5; -webkit-text-size-adjust:100%; }
  .wrap{ max-width:560px; margin:0 auto; padding:18px 16px 40px; }
  header{ display:flex; align-items:center; gap:10px; padding:6px 2px 14px; }
  header img{ height:34px; width:auto; }
  header span{ font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px 18px; box-shadow:0 6px 24px rgba(20,32,58,.07); }
  h1{ font-size:21px; line-height:1.25; margin:0 0 6px; color:var(--navy); }
  @media (prefers-color-scheme:dark){ h1{ color:#cfe0ff; } }
  p{ margin:8px 0; } .muted{ color:var(--muted); font-size:14px; }
  label.l{ display:block; font-weight:700; font-size:14px; margin:16px 0 6px; }
  .opt{ font-weight:400; color:var(--muted); }
  input[type=text],input[type=tel],textarea{ width:100%; font:inherit; font-size:16px; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; background:transparent; color:inherit; }
  textarea{ min-height:70px; resize:vertical; }
  .kinds{ display:grid; gap:8px; }
  .kind{ display:flex; gap:12px; align-items:center; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; cursor:pointer; }
  .kind input{ width:20px; height:20px; flex:none; }
  .kind b{ display:block; } .kind span{ font-size:13px; color:var(--muted); }
  .kind:has(input:checked){ border-color:var(--green); background:color-mix(in srgb,var(--green) 9%,transparent); }
  .pick{ display:flex; gap:8px; flex-wrap:wrap; }
  button,.btn{ font:inherit; font-weight:700; border-radius:12px; border:1.5px solid var(--line); background:transparent; color:inherit; padding:12px 16px; cursor:pointer; min-height:46px; display:inline-flex; align-items:center; justify-content:center; }
  button.primary{ background:var(--green); border-color:var(--green); color:#fff; width:100%; font-size:17px; margin-top:16px; }
  button:disabled{ opacity:.45; cursor:not-allowed; }
  .thumbs{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .th{ position:relative; width:92px; height:92px; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; display:grid; place-items:center; font-size:12px; color:#555; text-align:center; }
  .th img{ width:100%; height:100%; object-fit:cover; }
  .th button{ position:absolute; top:2px; right:2px; min-height:0; padding:0 7px; border-radius:50%; background:#fff; color:#000; font-size:16px; line-height:24px; }
  .consent{ display:flex; gap:10px; align-items:flex-start; font-size:13.5px; margin:16px 0 0; cursor:pointer; }
  .consent input{ width:22px; height:22px; margin-top:1px; flex:none; }
  .msg{ margin-top:12px; font-size:14px; min-height:20px; } .msg.err{ color:var(--bad); }
  .tag{ display:inline-block; background:color-mix(in srgb,var(--navy) 10%,transparent); border-radius:8px; padding:3px 10px; font-size:13px; font-weight:700; }
  .done{ text-align:center; padding:26px 8px; }
  .done .tick{ width:64px; height:64px; border-radius:50%; background:var(--green); color:#fff; display:grid; place-items:center; font-size:34px; margin:0 auto 12px; }
  .foot{ margin-top:18px; text-align:center; font-size:12px; color:var(--muted); }
  .hp{ position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header><img src="./assets/logo-cpa360.webp" alt="CPA360" /><span>Send your documents</span></header>
  <main class="card" id="root"><p class="muted">Loading…</p></main>
  <p class="foot">Only the CPA's office can see what you send.<br>CPA360™ — A GAD Foundation Programme</p>
</div>
<script src="./config.js"></script>
<script src="./src/submit.js"></script>
</body>
</html>
